info:
  name: Renovar Token
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/auth/renew"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        var jsonData = res.getBody();
        if (jsonData.token) {
            bru.setVar('token', jsonData.token);
            console.log('Token renovado y guardado');
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
